services:
  web-admin:
    build: ./web
    volumes:
      - ./web/src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # /cfg inherits the base file's named volume (rust-cfg) so it stays in sync with
      # rust-server; don't re-point it at the repo dir here or the two would diverge.
    command: ["bun", "run", "--watch", "src/index.ts"]
