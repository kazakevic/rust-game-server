services:
  rust-server:
    build: .
    platform: linux/amd64
    container_name: rust-server
    restart: unless-stopped
    # Rust saves the world on SIGTERM; the default 10s grace is too short for a large
    # map, so give it room before Docker SIGKILLs. The web admin passes a matching
    # per-call timeout (RUST_STOP_TIMEOUT, default 300s) to `docker stop`.
    stop_grace_period: 5m
    # steamcmd's bundled Steam runtime trips Docker's default seccomp filter
    # on some VPS kernels ("futex robust_list not initialized by pthreads"
    # segfault loop). Disabling seccomp for this container resolves it.
    security_opt:
      - seccomp:unconfined
    ports:
      - "${RUST_SERVER_PORT:-28015}:${RUST_SERVER_PORT:-28015}/udp"
      - "${RUST_SERVER_PORT:-28015}:${RUST_SERVER_PORT:-28015}/tcp"
      - "${RUST_RCON_PORT:-28016}:${RUST_RCON_PORT:-28016}/tcp"
      - "${RUST_SERVER_QUERYPORT:-28017}:${RUST_SERVER_QUERYPORT:-28017}/udp"
      - "${RUST_APP_PORT:-28082}:${RUST_APP_PORT:-28082}/tcp"
    env_file: .env
    volumes:
      - rust-data:/rust
      - ./plugins:/plugins:ro
      # /cfg is a named volume (not the repo dir) so web-admin settings survive Dokploy
      # redeploys. Writable here so the entrypoint can seed defaults from /seed-cfg on
      # first boot; RustDedicated itself writes config under /rust, not /cfg.
      - rust-cfg:/cfg
    stdin_open: true
    tty: true

  web-admin:
    build: ./web
    container_name: rust-web-admin
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    env_file: .env
    environment:
      - RUST_CONTAINER_NAME=rust-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - rust-cfg:/cfg
      - rust-data:/rust-data
    depends_on:
      - rust-server

volumes:
  rust-data:
  rust-cfg:
